# Render Blueprint for the AI service. The backend (reel2real-api) calls
# {this service}/api/v1/generate-reply via its AI_SERVICE_URL env var.
services:
  - type: web
    name: reel2real-ai
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # The free plan has no persistent disk, so the product vector store is
      # rebuilt from the catalog after each restart.
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma_db
